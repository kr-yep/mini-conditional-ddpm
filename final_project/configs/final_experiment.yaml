project_name: mini_conditional_ddpm_final

dataset:
  name: cifar10
  image_size: 32
  data_root: final_project/data
  num_classes: 10

training:
  seed: 42
  batch_size: 128
  num_epochs: 80
  learning_rate: 0.0002
  num_timesteps: 1000
  mixed_precision: true
  save_every_epochs: 10
  sample_every_epochs: 10
  sample_grid_steps: 50
  sample_grid_samples_per_class: 2
  early_stopping:
    enabled: true
    patience_epochs: 25
    min_delta: 0.00005
  num_workers: 4
  max_train_samples: null
  output_dir: final_project/outputs/custom_ddpm

model:
  base_channels: 64
  channel_mults: [1, 2, 4]
  time_emb_dim: 256
  class_emb_dim: 256
  dropout: 0.1

sampling:
  seeds: [7, 42, 3407]
  samples_per_class: 4
  num_sampling_steps: 100
  guidance_scale: null
  checkpoint: final_project/outputs/custom_ddpm/checkpoints/latest.pt

evaluation:
  metrics:
    - clipscore
    - clip_iqa_quality
    - runtime
    - peak_vram
    - human_eval_template
  baseline_summary: outputs/midterm_main/evaluation/summary_by_model.csv
